<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-label="Trois critères de forme pour reconnaître les clones d'hévéa : forme de l'avant-dernier étage foliaire, coupe de la foliole centrale, orientation des pétiolules">
  <style>
    .titre { font: bold 23px sans-serif; fill: #2f6b3a; }
    .nom { font: bold 21px sans-serif; fill: #1d271e; text-anchor: middle; }
    .clone { font: 17px sans-serif; fill: #8a5a10; text-anchor: middle; }
    .note { font: italic 16px sans-serif; fill: #5a6556; }
    .canopee { fill: #9cc89a; stroke: #2f6b3a; stroke-width: 3; }
    .tige { stroke: #6f7d3c; stroke-width: 7; stroke-linecap: round; }
    .limbe { stroke: #3d8a4b; stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .petiolule { stroke: #5f8f3a; stroke-width: 5; fill: none; stroke-linecap: round; }
    .foliole { fill: #7fb86a; stroke: #2f6b3a; stroke-width: 2; }
    .sep { stroke: #dad7c8; stroke-width: 2; }
  </style>
  <rect width="640" height="760" fill="#ffffff"/>

  <!-- 1. Forme de l'avant-dernier étage foliaire -->
  <text class="titre" x="20" y="34">1. Forme de l'avant-dernier étage foliaire</text>
  <line class="tige" x1="107" y1="60" x2="107" y2="200"/>
  <polygon class="canopee" points="107,62 30,188 184,188"/>
  <line class="tige" x1="320" y1="70" x2="320" y2="200"/>
  <path class="canopee" d="M236,188 Q236,82 320,82 Q404,82 404,188 Z"/>
  <line class="tige" x1="533" y1="80" x2="533" y2="200"/>
  <path class="canopee" d="M450,188 L476,96 L590,96 L616,188 Z"/>
  <text class="nom" x="107" y="226">Conique</text>
  <text class="clone" x="107" y="250">PB 217 · IRCA 331</text>
  <text class="nom" x="320" y="226">Hémisphérique</text>
  <text class="clone" x="320" y="250">IRCA 41 · IRCA 230</text>
  <text class="nom" x="533" y="226">Tronqué</text>
  <text class="clone" x="533" y="250">GT 1</text>
  <line class="sep" x1="20" y1="272" x2="620" y2="272"/>

  <!-- 2. Coupe transversale de la foliole centrale -->
  <text class="titre" x="20" y="306">2. Coupe de la foliole centrale</text>
  <text class="note" x="20" y="330">On coupe la foliole en travers ; la face supérieure est en haut.</text>
  <path class="limbe" d="M32,392 L182,392"/>
  <circle cx="107" cy="392" r="7" fill="#2f6b3a"/>
  <path class="limbe" d="M245,368 Q320,430 395,368"/>
  <circle cx="320" cy="399" r="7" fill="#2f6b3a"/>
  <path class="limbe" d="M458,360 L533,418 L608,360"/>
  <circle cx="533" cy="418" r="7" fill="#2f6b3a"/>
  <text class="nom" x="107" y="460">Plate</text>
  <text class="clone" x="107" y="484">GT 1 · IRCA 331</text>
  <text class="nom" x="320" y="460">Concave</text>
  <text class="clone" x="320" y="484">IRCA 41 · IRCA 230</text>
  <text class="nom" x="533" y="460">En V</text>
  <text class="clone" x="533" y="484">PB 217</text>
  <line class="sep" x1="20" y1="506" x2="620" y2="506"/>

  <!-- 3. Orientation des pétiolules -->
  <text class="titre" x="20" y="540">3. Orientation des pétiolules</text>
  <!-- Droits -->
  <line class="petiolule" x1="107" y1="690" x2="107" y2="650" stroke-width="7"/>
  <path class="petiolule" d="M107,650 L107,598"/>
  <path class="petiolule" d="M107,650 L68,612"/>
  <path class="petiolule" d="M107,650 L146,612"/>
  <ellipse class="foliole" cx="107" cy="586" rx="8" ry="14"/>
  <ellipse class="foliole" cx="61" cy="604" rx="8" ry="14" transform="rotate(-45 61 604)"/>
  <ellipse class="foliole" cx="153" cy="604" rx="8" ry="14" transform="rotate(45 153 604)"/>
  <!-- Ascendants -->
  <line class="petiolule" x1="320" y1="690" x2="320" y2="650" stroke-width="7"/>
  <path class="petiolule" d="M320,650 L320,598"/>
  <path class="petiolule" d="M320,650 Q286,640 284,596"/>
  <path class="petiolule" d="M320,650 Q354,640 356,596"/>
  <ellipse class="foliole" cx="320" cy="586" rx="8" ry="14"/>
  <ellipse class="foliole" cx="283" cy="583" rx="8" ry="14" transform="rotate(-8 283 583)"/>
  <ellipse class="foliole" cx="357" cy="583" rx="8" ry="14" transform="rotate(8 357 583)"/>
  <!-- Déclinants -->
  <line class="petiolule" x1="533" y1="690" x2="533" y2="650" stroke-width="7"/>
  <path class="petiolule" d="M533,650 Q536,624 542,604"/>
  <path class="petiolule" d="M533,650 Q500,618 474,640"/>
  <path class="petiolule" d="M533,650 Q566,618 592,640"/>
  <ellipse class="foliole" cx="545" cy="592" rx="8" ry="14" transform="rotate(12 545 592)"/>
  <ellipse class="foliole" cx="464" cy="648" rx="8" ry="14" transform="rotate(-120 464 648)"/>
  <ellipse class="foliole" cx="602" cy="648" rx="8" ry="14" transform="rotate(120 602 648)"/>
  <text class="nom" x="107" y="722">Droits</text>
  <text class="clone" x="107" y="746">PB 217 · IRCA 331</text>
  <text class="nom" x="320" y="722">Ascendants</text>
  <text class="clone" x="320" y="746">IRCA 41 · IRCA 230</text>
  <text class="nom" x="533" y="722">Déclinants</text>
  <text class="clone" x="533" y="746">GT 1</text>
</svg>
