<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Schéma d'une feuille d'hévéa : tige, bourgeon axillaire, long pétiole, glandes nectarifères, trois pétiolules et trois folioles">
  <style>
    .t { font: 22px sans-serif; fill: #1d271e; }
    .s { font: 17px sans-serif; fill: #5a6556; }
    .trait { stroke: #5a6556; stroke-width: 1.5; fill: none; }
    .feuille { fill: #7fb86a; stroke: #2f6b3a; stroke-width: 3; }
    .nervure { stroke: #2f6b3a; stroke-width: 2; }
  </style>
  <rect width="640" height="560" fill="#ffffff"/>
  <!-- Tige -->
  <line x1="90" y1="545" x2="90" y2="40" stroke="#6f7d3c" stroke-width="12" stroke-linecap="round"/>
  <!-- Bourgeon axillaire -->
  <path d="M96,428 L112,416 L98,404 Z" fill="#b08a3c" stroke="#6b4f1d" stroke-width="2"/>
  <!-- Pétiole (long) -->
  <path d="M94,420 C170,380 250,300 330,252" stroke="#5f8f3a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Pétiolules -->
  <line x1="330" y1="252" x2="330" y2="196" stroke="#5f8f3a" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="252" x2="296" y2="214" stroke="#5f8f3a" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="252" x2="364" y2="214" stroke="#5f8f3a" stroke-width="5" stroke-linecap="round"/>
  <!-- Glandes nectarifères -->
  <circle cx="323" cy="250" r="4.5" fill="#c0392b"/>
  <circle cx="331" cy="246" r="4.5" fill="#c0392b"/>
  <circle cx="338" cy="251" r="4.5" fill="#c0392b"/>
  <!-- Folioles -->
  <g transform="translate(330,196)">
    <path class="feuille" d="M0,0 C34,-28 40,-100 0,-160 C-40,-100 -34,-28 0,0 Z"/>
    <line class="nervure" x1="0" y1="0" x2="0" y2="-152"/>
  </g>
  <g transform="translate(296,214) rotate(-52)">
    <path class="feuille" d="M0,0 C30,-26 36,-92 0,-145 C-36,-92 -30,-26 0,0 Z"/>
    <line class="nervure" x1="0" y1="0" x2="0" y2="-138"/>
  </g>
  <g transform="translate(364,214) rotate(52)">
    <path class="feuille" d="M0,0 C30,-26 36,-92 0,-145 C-36,-92 -30,-26 0,0 Z"/>
    <line class="nervure" x1="0" y1="0" x2="0" y2="-138"/>
  </g>
  <!-- Étiquettes -->
  <path class="trait" d="M346,96 L430,62"/>
  <text class="t" x="436" y="66">Foliole centrale</text>
  <path class="trait" d="M470,150 L500,190"/>
  <text class="t" x="452" y="214">Foliole latérale</text>
  <path class="trait" d="M350,222 L404,272"/>
  <text class="t" x="410" y="282">Pétiolules (3)</text>
  <path class="trait" d="M340,258 L404,316"/>
  <text class="t" x="410" y="324">Glandes nectarifères</text>
  <text class="s" x="410" y="346">au sommet du pétiole</text>
  <path class="trait" d="M222,326 L262,388"/>
  <text class="t" x="232" y="412">Pétiole</text>
  <text class="s" x="232" y="434">long, porte la feuille</text>
  <path class="trait" d="M110,424 L150,472"/>
  <text class="t" x="128" y="496">Bourgeon axillaire</text>
  <text class="s" x="128" y="518">(l'« œil » utilisé au greffage)</text>
  <text class="t" x="106" y="40">Tige</text>
</svg>
