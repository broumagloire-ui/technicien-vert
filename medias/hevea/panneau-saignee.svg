<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Panneau de saignée d'un hévéa : encoche en demi-spirale descendante ouverte à 1,20 m, pente de 33 degrés, gouttière et tasse ; coupe de l'écorce montrant la profondeur à respecter au-dessus du cambium">
  <style>
    .t { font: 18px sans-serif; fill: #1d271e; }
    .tb { font: bold 18px sans-serif; fill: #1d271e; }
    .s { font: italic 15px sans-serif; fill: #5a6556; }
    .trait { stroke: #5a6556; stroke-width: 1.5; fill: none; }
    .cote { stroke: #8a5a10; stroke-width: 2; fill: none; }
    .gen { stroke: #2f6b3a; stroke-width: 2; stroke-dasharray: 8 6; }
  </style>
  <rect width="640" height="720" fill="#ffffff"/>
  <!-- Tronc -->
  <rect x="150" y="30" width="200" height="640" fill="#b5a685" stroke="#6b5a3a" stroke-width="3"/>
  <line x1="40" y1="670" x2="400" y2="670" stroke="#8a5a10" stroke-width="4"/>
  <!-- Génératrices (limites du panneau = moitié de la circonférence) -->
  <line class="gen" x1="152" y1="40" x2="152" y2="660"/>
  <line class="gen" x1="348" y1="40" x2="348" y2="660"/>
  <!-- Écorce déjà consommée (panneau) au-dessus de l'encoche -->
  <path d="M152,262 L348,390 L348,372 L152,244 Z" fill="#d9c9a3"/>
  <!-- Encoche : demi-spirale descendante, haut à gauche, bas à droite -->
  <path d="M152,262 L348,390" stroke="#5b3b1a" stroke-width="7"/>
  <path d="M152,262 L348,390" stroke="#ffffff" stroke-width="3"/>
  <!-- Gouttière et tasse -->
  <path d="M348,390 L348,405" stroke="#ffffff" stroke-width="3"/>
  <path d="M332,402 L362,418" stroke="#7f8c99" stroke-width="5" stroke-linecap="round"/>
  <path d="M327,432 L367,432 L362,478 L332,478 Z" fill="#e6e1d3" stroke="#5a6556" stroke-width="2"/>
  <path d="M334,445 L360,445 L358,476 L336,476 Z" fill="#ffffff"/>
  <path d="M326,430 C326,420 368,420 368,430" fill="none" stroke="#7f8c99" stroke-width="2"/>
  <!-- Hauteur d'ouverture -->
  <path class="cote" d="M100,262 L100,670 M90,262 L110,262 M90,670 L110,670"/>
  <text class="tb" x="22" y="470">1,20 m</text>
  <text class="s" x="14" y="492">hauteur</text>
  <text class="s" x="14" y="510">d'ouverture</text>
  <!-- Pente -->
  <path class="cote" d="M152,262 L232,262"/>
  <path d="M212,262 A60,60 0 0 1 203,295" fill="none" stroke="#8a5a10" stroke-width="2"/>
  <text class="tb" x="218" y="292">33°</text>
  <!-- Étiquettes -->
  <path class="trait" d="M260,328 L420,272"/>
  <text class="tb" x="426" y="276">Encoche</text>
  <text class="t" x="426" y="297">demi-spirale (1/2 S),</text>
  <text class="t" x="426" y="317">du haut à gauche</text>
  <text class="t" x="426" y="337">vers le bas à droite</text>
  <text class="s" x="426" y="357">pente 33° (30 à 35°)</text>
  <path class="trait" d="M362,412 L420,402"/>
  <text class="t" x="426" y="400">Gouttière, 15 cm</text>
  <text class="t" x="426" y="420">sous l'encoche</text>
  <path class="trait" d="M368,455 L420,462"/>
  <text class="t" x="426" y="466">Tasse, 15 à 20 cm</text>
  <text class="t" x="426" y="486">sous la gouttière</text>
  <path class="trait" d="M348,560 L420,560"/>
  <text class="t" x="426" y="556">Génératrices :</text>
  <text class="t" x="426" y="576">limites du panneau</text>
  <text class="t" x="426" y="596">(la moitié du tronc)</text>
  <!-- Coupe de l'écorce -->
  <g transform="translate(420,10)">
    <text class="tb" x="0" y="16">Profondeur de saignée</text>
    <rect x="0" y="30" width="60" height="140" fill="#b5a685" stroke="#6b5a3a"/>
    <rect x="60" y="30" width="10" height="140" fill="#9cbf6e"/>
    <rect x="70" y="30" width="130" height="140" fill="#f2e6c4" stroke="#7a6a3a"/>
    <path d="M0,62 L48,62 L48,104 L0,104" fill="#ffffff" stroke="#5b3b1a" stroke-width="2"/>
    <path class="cote" d="M48,118 L60,118 M48,112 L48,124 M60,112 L60,124"/>
    <text class="s" x="2" y="190">écorce</text>
    <text class="s" x="58" y="208">cambium</text>
    <text class="s" x="118" y="190">bois</text>
  </g>
  <text class="t" x="420" y="642">Rester à 1,5 mm du cambium.</text>
  <text class="t" x="420" y="662">Copeau : 1,3 à 2 mm</text>
  <text class="t" x="420" y="682">par saignée selon la fréquence.</text>
</svg>
