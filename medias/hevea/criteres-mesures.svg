<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Trois autres critères pour reconnaître les clones d'hévéa : longueur du pétiolule central, couleur des feuilles, abondance des glandes nectarifères">
  <style>
    .titre { font: bold 23px sans-serif; fill: #2f6b3a; }
    .nom { font: bold 20px sans-serif; fill: #1d271e; }
    .clone { font: 17px sans-serif; fill: #8a5a10; }
    .note { font: italic 16px sans-serif; fill: #5a6556; }
    .reg { font: 15px sans-serif; fill: #5a6556; text-anchor: middle; }
    .sep { stroke: #dad7c8; stroke-width: 2; }
    .centre { text-anchor: middle; }
  </style>
  <rect width="640" height="640" fill="#ffffff"/>

  <!-- 4. Longueur du pétiolule central -->
  <text class="titre" x="20" y="34">4. Longueur du pétiolule central</text>
  <!-- Règle : 0 à 2 cm, 200 px par cm, origine x = 200 -->
  <line x1="200" y1="62" x2="600" y2="62" stroke="#5a6556" stroke-width="2"/>
  <g stroke="#5a6556" stroke-width="2">
    <line x1="200" y1="56" x2="200" y2="68"/><line x1="300" y1="58" x2="300" y2="66"/>
    <line x1="400" y1="56" x2="400" y2="68"/><line x1="500" y1="58" x2="500" y2="66"/><line x1="600" y1="56" x2="600" y2="68"/>
  </g>
  <text class="reg" x="200" y="52">0</text><text class="reg" x="300" y="52">0,5</text>
  <text class="reg" x="400" y="52">1 cm</text><text class="reg" x="500" y="52">1,5</text><text class="reg" x="600" y="52">2 cm</text>
  <rect x="200" y="82" width="170" height="16" rx="8" fill="#a8d08d" stroke="#2f6b3a"/>
  <text class="nom" x="20" y="98">Court</text><text class="clone" x="20" y="118">≤ 0,9 cm · PB 217</text>
  <rect x="200" y="132" width="240" height="16" rx="8" fill="#5a9e48" stroke="#2f6b3a"/>
  <text class="nom" x="20" y="148">Moyen</text><text class="clone" x="20" y="168">1 à 1,4 cm · les 3 IRCA</text>
  <rect x="200" y="182" width="330" height="16" rx="8" fill="#2c5e2a" stroke="#1d271e"/>
  <text class="nom" x="20" y="198">Long</text><text class="clone" x="20" y="218">&gt; 1,4 cm · GT 1</text>
  <line class="sep" x1="20" y1="240" x2="620" y2="240"/>

  <!-- 5. Couleur des feuilles -->
  <text class="titre" x="20" y="274">5. Couleur des feuilles</text>
  <rect x="40" y="292" width="150" height="70" rx="10" fill="#a8d08d" stroke="#2f6b3a" stroke-width="2"/>
  <rect x="245" y="292" width="150" height="70" rx="10" fill="#5a9e48" stroke="#2f6b3a" stroke-width="2"/>
  <rect x="450" y="292" width="150" height="70" rx="10" fill="#2c5e2a" stroke="#1d271e" stroke-width="2"/>
  <text class="nom centre" x="115" y="390">Vert clair</text><text class="clone centre" x="115" y="412">PB 217</text>
  <text class="nom centre" x="320" y="390">Vert</text><text class="clone centre" x="320" y="412">IRCA 41, 230, 331</text>
  <text class="nom centre" x="525" y="390">Vert foncé</text><text class="clone centre" x="525" y="412">GT 1</text>
  <text class="note" x="20" y="436">Compare toujours des feuilles matures, à la même lumière.</text>
  <line class="sep" x1="20" y1="452" x2="620" y2="452"/>

  <!-- 6. Glandes nectarifères -->
  <text class="titre" x="20" y="486">6. Glandes nectarifères</text>
  <text class="note" x="20" y="508">Au sommet du pétiole, à la base des pétiolules.</text>
  <!-- Peu abondantes : 3 petites -->
  <line x1="115" y1="600" x2="115" y2="548" stroke="#5f8f3a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="106" cy="547" r="4" fill="#c0392b"/><circle cx="115" cy="542" r="4" fill="#c0392b"/><circle cx="124" cy="547" r="4" fill="#c0392b"/>
  <!-- Abondantes : 3-4 -->
  <line x1="320" y1="600" x2="320" y2="548" stroke="#5f8f3a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="308" cy="548" r="5.5" fill="#c0392b"/><circle cx="316" cy="540" r="5.5" fill="#c0392b"/>
  <circle cx="325" cy="540" r="5.5" fill="#c0392b"/><circle cx="333" cy="548" r="5.5" fill="#c0392b"/>
  <!-- Très abondantes : 3-6 larges -->
  <line x1="525" y1="600" x2="525" y2="550" stroke="#5f8f3a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="508" cy="548" r="7.5" fill="#c0392b"/><circle cx="518" cy="536" r="7.5" fill="#c0392b"/>
  <circle cx="532" cy="536" r="7.5" fill="#c0392b"/><circle cx="542" cy="548" r="7.5" fill="#c0392b"/>
  <circle cx="525" cy="525" r="7.5" fill="#c0392b"/>
  <text class="nom centre" x="115" y="622">Peu abondantes (3)</text>
  <text class="nom centre" x="320" y="622">Abondantes (3-4)</text>
  <text class="nom centre" x="525" y="622">Très abondantes</text>
  <text class="clone centre" x="115" y="639">IRCA 41</text>
  <text class="clone centre" x="320" y="639">PB 217 · IRCA 230 · IRCA 331</text>
  <text class="clone centre" x="525" y="639">GT 1 (3-6 larges)</text>
</svg>
