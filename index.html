<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<meta name="description" content="Ta formation en agriculture tropicale, niveau technicien supérieur, même sans internet.">
<title>Technicien Vert</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="entete">
  <a href="#/accueil" class="marque" aria-label="Technicien Vert, accueil">
    <img src="icones/icone.svg" alt="" width="30" height="30">
    <span>Technicien Vert</span>
  </a>
  <button class="synchro" id="etat-synchro" data-action="synchroniser" aria-label="Synchroniser" hidden>
    <span class="pastille"></span><span class="texte"></span>
  </button>
  <a href="#/reglages" class="bouton-icone" aria-label="Réglages">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </a>
</header>

<div id="bandeau" class="bandeau" role="status" hidden>
  <span class="texte"></span>
  <button class="bouton primaire petit" data-action="maj-app">Mettre à jour</button>
</div>

<main id="vue" tabindex="-1"></main>

<nav class="onglets" aria-label="Navigation principale">
  <a href="#/accueil" data-onglet="accueil">
    <span class="icone-onglet"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
    <span>Accueil</span>
  </a>
  <a href="#/lecons" data-onglet="lecons">
    <span class="icone-onglet"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg></span>
    <span>Leçons</span>
  </a>
  <a href="#/fiches" data-onglet="fiches">
    <span class="icone-onglet"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg></span>
    <span>Révisions</span>
    <b class="badge" id="badge-fiches" hidden></b>
  </a>
  <a href="#/questions" data-onglet="questions">
    <span class="icone-onglet"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
    <span>Questions</span>
    <b class="badge" id="badge-questions" hidden></b>
  </a>
</nav>

<dialog id="dialogue-question" class="dialogue" aria-labelledby="titre-dialogue">
  <form method="dialog" id="form-question">
    <h2 id="titre-dialogue">Demander à Claude</h2>
    <p class="contexte-dialogue"></p>
    <label for="texte-question">Ta question</label>
    <textarea id="texte-question" name="texte" rows="4" required placeholder="Par exemple : je n'ai pas compris pourquoi…"></textarea>
    <input type="hidden" name="lecon">
    <input type="hidden" name="ref">
    <input type="hidden" name="contexte">
    <p class="aide">Ta question partira à la prochaine synchronisation. Claude y répondra lors de votre prochaine séance, et la réponse arrivera dans l'onglet Questions.</p>
    <div class="actions">
      <button class="bouton discret" value="annuler" formnovalidate>Annuler</button>
      <button class="bouton primaire" value="envoyer">Enregistrer</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
